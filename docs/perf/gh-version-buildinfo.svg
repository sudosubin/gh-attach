<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="gh CLI version resolution: 34 milliseconds before, 0.2 milliseconds after, about 170 times faster"><rect width="860" height="360" fill="#fcfcfb"/><text x="32.0" y="44.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="start">gh CLI version resolution</text><text x="32.0" y="66.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#898781" text-anchor="start">internal/github/rest — cost of one githubCLIAppVersion() call</text><text x="32.0" y="120.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#898781" text-anchor="start">BEFORE — exec("gh version")</text><text x="32.0" y="176.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="700" fill="#0b0b0b" text-anchor="start">34 ms</text><text x="32.0" y="204.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">warm subprocess spawn; up to 1.45s cold</text><line x1="430.0" y1="100" x2="430.0" y2="250" stroke="#e1e0d9" stroke-width="1"/><text x="444.0" y="120.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#898781" text-anchor="start">AFTER — debug/buildinfo.ReadFile</text><text x="444.0" y="176.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="700" fill="#2a78d6" text-anchor="start">0.2 ms</text><text x="444.0" y="204.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">no process spawn; -trimpath builds still fall back to exec</text><rect x="32.00" y="280.00" width="297.74" height="36.00" rx="18.00" ry="18.00" fill="#eaf4e6"/><circl