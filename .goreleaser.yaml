version: 2

project_name: gh-attach

before:
  hooks:
    - go mod download

builds:
  - id: gh-attach
    main: ./cmd/gh-attach
    binary: gh-attach
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: gh-attach
    builds:
      - gh-attach
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

changelog:
  sort: asc
