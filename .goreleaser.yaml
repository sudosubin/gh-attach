version: 2

project_name: gh-attach

before:
  hooks:
    - go mod download

builds:
  - id: gh-attach
    main: ./cmd/gh-attach
    binary: gh-attach
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: gh-attach
    builds:
      - gh-attach
    formats:
      - binary
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

changelog:
  sort: asc

homebrew_casks:
  - name: gh-attach
    ids:
      - gh-attach
    binaries:
      - gh-attach
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Casks
    homepage: "https://github.com/sudosubin/gh-attach"
    description: "GitHub user attachment upload CLI for gh"
    skip_upload: auto
    repository:
      owner: sudosubin
      name: homebrew-gh-attach
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
